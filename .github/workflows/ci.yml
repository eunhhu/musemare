name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --ipc=host

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install pinned npm
        run: |
          npm install --global npm@11.6.2
          test "$(npm --version)" = "11.6.2"

      - name: Install dependencies
        run: npm ci

      - name: Verify offline clean install plan
        run: npm ci --dry-run --offline

      - name: Verify dependency tree
        run: npm ls --all

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Level and asset integrity tests
        run: npm run test:integrity

      - name: Dependency audit
        run: npm run audit

      - name: Production build
        run: npm run build

      - name: Production browser smoke
        run: npm run smoke
